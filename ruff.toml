# Based on NASA JPL autoRIFT's Ruff configuration:
# https://github.com/nasa-jpl/autoRIFT/blob/main/ruff.toml

line-length = 120

# Directories Ruff should treat as first-party imports.
src = [
  ".",
  "src",
]

[format]
indent-style = "space"
quote-style = "double"

[lint]
extend-select = [
  "NPY", # numpy-specific rules: https://docs.astral.sh/ruff/rules/#numpy-specific-rules-npy
  "ANN401", # ban function argument and return annotations that use Any
  "I", # isort: https://docs.astral.sh/ruff/rules/#isort-i
  "UP", # pyupgrade: https://docs.astral.sh/ruff/rules/#pyupgrade-up
  "D", # pydocstyle: https://docs.astral.sh/ruff/rules/#pydocstyle-d
  "ANN", # annotations: https://docs.astral.sh/ruff/rules/#flake8-annotations-ann
  "PTH", # use-pathlib-pth: https://docs.astral.sh/ruff/rules/#flake8-use-pathlib-pth
  "B", # bugbear: https://docs.astral.sh/ruff/rules/#flake8-bugbear-b
  "C90", # mccabe complexity: https://docs.astral.sh/ruff/rules/#mccabe-c90
  "SIM", # simplify: https://docs.astral.sh/ruff/rules/#flake8-simplify-sim
  "TRY", # exception style: https://docs.astral.sh/ruff/rules/#tryceratops-try
  "PERF", # performance: https://docs.astral.sh/ruff/rules/#perflint-perf
  "PL", # pylint: https://docs.astral.sh/ruff/rules/#pylint-pl
  "RUF", # Ruff-specific rules: https://docs.astral.sh/ruff/rules/#ruff-specific-rules-ruf
]

[lint.pydocstyle]
convention = "google"

[lint.isort]
case-sensitive = true
lines-after-imports = 2

[lint.flake8-annotations]
suppress-dummy-args = true
