name: Publish datasets image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/publish-images.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "HIFLD_Open_Inventory_12112025.csv"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "helm/**"
      - "scripts/**"
      - "src/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-images.yml"
      - ".dockerignore"
      - "Dockerfile"
      - "HIFLD_Open_Inventory_12112025.csv"
      - "README.md"
      - "pyproject.toml"
      - "uv.lock"
      - "helm/**"
      - "scripts/**"
      - "src/**"

permissions:
  contents: read
  packages: write

env:
  DAGSTER_IMAGE: ghcr.io/fulton-ring/hifld-next-datasets/dagster-user

jobs:
  build-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build datasets image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ env.DAGSTER_IMAGE }}:${{ github.sha }}

  publish:
    if: github.event_name != 'pull_request'
    needs: build-only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push datasets image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.DAGSTER_IMAGE }}:${{ github.sha }}

      - name: Promote main image to latest
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${DAGSTER_IMAGE}:latest" \
            "${DAGSTER_IMAGE}:${GITHUB_SHA}"
