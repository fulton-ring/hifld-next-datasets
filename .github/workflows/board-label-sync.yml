name: Legacy board tools CI

# Board scanning, card moves, and worker admission belong to the native factory.
# Retain validation of the historical tools without any mutation or dispatch job.
on:
  pull_request:
    paths: [".github/workflows/board-label-sync.yml", "tools/board_sync.py", "tools/board_dispatch.py", "tools/agent_handoffs.py", "tests/test_board_*.py"]
  push:
    branches: [main]
    paths: [".github/workflows/board-label-sync.yml", "tools/board_sync.py", "tools/board_dispatch.py", "tools/agent_handoffs.py", "tests/test_board_*.py"]

permissions:
  contents: read

concurrency:
  group: board-label-sync
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_board_*.py'
