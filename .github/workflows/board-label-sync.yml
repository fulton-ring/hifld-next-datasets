name: Board label sync

on:
  schedule:
    - cron: "*/15 * * * *"
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List requested moves without changing the board or labels"
        type: boolean
        default: true
  pull_request:
    paths: [".github/workflows/board-label-sync.yml", "tools/board_sync.py", "tests/test_board_sync.py"]
  push:
    branches: [main]
    paths: [".github/workflows/board-label-sync.yml", "tools/board_sync.py", "tests/test_board_sync.py"]

permissions:
  contents: read

concurrency:
  group: board-label-sync
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_board_sync.py

  sync:
    if: >-
      github.repository == 'fulton-ring/hifld-next-datasets' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(fromJSON('["move:backlog","move:ready","move:in-progress","move:review","move:needs-decision"]'), github.event.label.name)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.AGENT_BOARD_TOKEN }}
      GH_REPO_TOKEN: ${{ github.token }}
      PROJECT_OWNER: fulton-ring
      PROJECT_NUMBER: "2"
      REPO: fulton-ring/hifld-next-datasets
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Apply requested card moves without dispatching workers
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" ]]; then
            echo '::error::Set AGENT_BOARD_TOKEN with organization Projects read/write access.'
            exit 1
          fi
          args=()
          if [[ -n "$ISSUE_NUMBER" ]]; then args+=(--issue "$ISSUE_NUMBER"); fi
          if [[ "$DRY_RUN" == 1 ]]; then args+=(--dry-run); fi
          python3 tools/board_sync.py "${args[@]}"
