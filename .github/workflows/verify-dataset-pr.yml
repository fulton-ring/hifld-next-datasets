name: Verify dataset PR
run-name: "Dataset verification PR #${{ github.event.pull_request.number || inputs.pr_number }} @ ${{ github.event.pull_request.head.sha || inputs.head_sha }} base ${{ (github.event_name == 'pull_request_target' && github.sha) || inputs.base_sha }}"

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository pull request number
        required: true
        type: string
      head_sha:
        description: Exact current PR head SHA
        required: true
        type: string
      base_sha:
        description: Exact current PR base SHA
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  resolve:
    # Dispatch must use trusted main, never a PR-supplied workflow.
    if: github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.identity.outputs.pr_number }}
      head_sha: ${{ steps.identity.outputs.head_sha }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
    steps:
      - uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test trusted identity gate
        run: python3 -I -m unittest discover -s scripts/verification/tests -v
      - name: Validate exact current PR head and base
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          BASE_SHA: ${{ (github.event_name == 'pull_request_target' && github.sha) || inputs.base_sha }}
        run: python3 -I scripts/verification/dataset_pr_identity.py

  verify:
    needs: resolve
    name: verify-pr-${{ needs.resolve.outputs.pr_number }}-${{ needs.resolve.outputs.head_sha }}-base-${{ needs.resolve.outputs.base_sha }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 50
    permissions:
      contents: read
    env:
      # Local, isolated roots; no production storage or model credentials.
      HIFLD_STAGING_BUCKET: ''
      HIFLD_DATASETS_BUCKET: ''
    steps:
      - uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2
        with:
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 0 # Provenance regressions validate historical Git blobs.
          persist-credentials: false
      - name: Checkout trusted baseline tests
        uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2
        with:
          ref: ${{ needs.resolve.outputs.base_sha }}
          path: trusted-baseline
          persist-credentials: false
      - name: Prepare exact prospective merge
        env:
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
          GIT_AUTHOR_NAME: Dataset verification
          GIT_AUTHOR_EMAIL: verification@example.invalid
          GIT_COMMITTER_NAME: Dataset verification
          GIT_COMMITTER_EMAIL: verification@example.invalid
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          # Commit the prospective tree so code_commit provenance identifies its actual blobs.
          export GIT_AUTHOR_DATE="$(git show -s --format=%cI "$BASE_SHA")"
          export GIT_COMMITTER_DATE="$GIT_AUTHOR_DATE"
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false merge --no-ff \
            -m "CI prospective merge of $HEAD_SHA with $BASE_SHA" "$BASE_SHA"
          printf 'Testing prospective merge %s for head %s base %s\n' "$(git rev-parse HEAD)" "$HEAD_SHA" "$BASE_SHA"
      - name: Preserve proposed tests and install trusted baseline suite
        run: |
          cp -a tests "$RUNNER_TEMP/proposed-tests"
          rm -rf tests
          mv trusted-baseline/tests tests
          rm -rf trusted-baseline
      - name: Configure isolated local directories
        run: |
          # Several existing draft transports check this worker-layout filesystem.
          sudo install -d -m 0755 -o "$(id -u)" -g "$(id -g)" /workspace
          python3 -c 'import shutil; assert shutil.disk_usage("/workspace").free >= 2_000_000_000, "insufficient test disk reserve"'

          echo "HIFLD_STAGING_DIR=$RUNNER_TEMP/dataset-staging" >> "$GITHUB_ENV"
          echo "HIFLD_DATASETS_DIR=$RUNNER_TEMP/dataset-published" >> "$GITHUB_ENV"
          echo "DAGSTER_HOME=$RUNNER_TEMP/dagster" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: false
      - name: Install pinned PMTiles compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libsqlite3-dev zlib1g-dev
          git init "$RUNNER_TEMP/tippecanoe"
          git -C "$RUNNER_TEMP/tippecanoe" fetch --depth=1 https://github.com/felt/tippecanoe.git 2d548bed0623005ab1ae619595ef4cfe1c745d3e
          git -C "$RUNNER_TEMP/tippecanoe" checkout --detach FETCH_HEAD
          make -C "$RUNNER_TEMP/tippecanoe" -j2
          sudo install "$RUNNER_TEMP/tippecanoe/tippecanoe" "$RUNNER_TEMP/tippecanoe/tippecanoe-decode" /usr/local/bin/
          tippecanoe --version
      - name: Install locked dependencies
        run: |
          mkdir -p "$DAGSTER_HOME" "$HIFLD_STAGING_DIR" "$HIFLD_DATASETS_DIR"
          timeout 8m uv sync --locked
      - name: Isolated Dagster verification, promotion and drift preservation
        run: timeout 5m uv run --locked python -m unittest tests.test_full_verification.ReleaseBoundaryTests.test_dagster_synthetic_verify_promote_and_failed_promotion_preservation -v
      - name: Complete trusted baseline suite against prospective merge source
        run: timeout 20m uv run --locked python -m unittest discover tests -v
      - name: Restore proposed tests
        run: |
          rm -rf tests
          mv "$RUNNER_TEMP/proposed-tests" tests
      - name: Complete proposed unittest suite (no baseline waivers)
        run: timeout 20m uv run --locked python -m unittest discover tests -v

  identity-still-current:
    needs: [resolve, verify]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: useblacksmith/checkout@2b9fe87d796feea153b455ec2f3125b471a7b0e7 # v1.8.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recheck PR after tests in a fresh trusted job
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          BASE_SHA: ${{ needs.resolve.outputs.base_sha }}
        run: python3 -I scripts/verification/dataset_pr_identity.py
